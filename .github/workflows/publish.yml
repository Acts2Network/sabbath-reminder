name: Publish to Chrome Web Store

# Publishes the extension when you push a version tag, e.g.:
#   git tag v1.1.0 && git push origin v1.1.0
#
# Requires these repository secrets (Settings → Secrets and variables → Actions):
#   CWS_EXTENSION_ID   - the extension's ID from the Web Store dashboard URL
#   CWS_CLIENT_ID      - OAuth client ID (Desktop app)
#   CWS_CLIENT_SECRET  - OAuth client secret
#   CWS_REFRESH_TOKEN  - OAuth refresh token (scope: chromewebstore)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build extension zip
        run: |
          zip -r sabbath-reminder.zip manifest.json src icons -x '*.DS_Store'
          unzip -l sabbath-reminder.zip

      - name: Upload and publish
        run: |
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source sabbath-reminder.zip \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN" \
            --auto-publish
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
