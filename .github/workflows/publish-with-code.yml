name: Publish with auth code (one-shot)

# Manual publish that exchanges a fresh OAuth auth code for a refresh token
# inside the run, then uploads + publishes. Use this to bypass a broken
# CWS_REFRESH_TOKEN secret, or to mint a working token.
#
# How to use:
#   1. Open this URL in a browser (fill in your client id):
#        https://accounts.google.com/o/oauth2/auth?response_type=code&access_type=offline&prompt=consent&redirect_uri=http://localhost&scope=https://www.googleapis.com/auth/chromewebstore&client_id=YOUR_CLIENT_ID
#   2. Approve. The browser redirects to http://localhost/?code=XXXX
#      (the page fails to load — that's fine). Copy the code value.
#   3. Actions tab -> "Publish with auth code (one-shot)" -> Run workflow,
#      paste the code. Codes are single-use and expire in minutes, so run promptly.
#
# Uses secrets: CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET.

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: "Fresh OAuth authorization code (single-use)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build extension zip
        run: zip -r sabbath-reminder.zip manifest.json src icons -x '*.DS_Store'

      - name: Exchange auth code for refresh token
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          AUTH_CODE: ${{ inputs.auth_code }}
        run: |
          resp=$(curl -s https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d code="$AUTH_CODE" \
            -d grant_type=authorization_code \
            -d redirect_uri=http://localhost)

          refresh=$(echo "$resp" | jq -r '.refresh_token // empty')
          if [ -z "$refresh" ]; then
            # Print only the error fields, never tokens.
            echo "Token exchange failed:"
            echo "$resp" | jq '{error, error_description}'
            exit 1
          fi
          echo "::add-mask::$refresh"
          echo "REFRESH_TOKEN=$refresh" >> "$GITHUB_ENV"
          echo "Got a refresh token. Proceeding to upload."

      - name: Upload and publish
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
        run: |
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source sabbath-reminder.zip \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN" \
            --auto-publish
